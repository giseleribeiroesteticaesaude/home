<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gisele Ribeiro | Links Úteis</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="https://i.ibb.co/fGSXRLW4/Giselr-Besf-nw.webp">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main Style -->
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .links-container {
            width: 100%;
            max-width: 450px;
            text-align: center;
            background: white;
            padding: 3rem 2rem;
            border-radius: 32px;
            box-shadow: var(--shadow-lg);
        }

        .hub-logo {
            height: 120px;
            margin-bottom: 1.5rem;
            object-fit: contain;
        }

        .hub-intro h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--primary-blue-dark);
        }

        .hub-intro p {
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            color: var(--text-muted);
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-btn {
            width: 100%;
            padding: 1.2rem;
            border-radius: 16px;
            background: white;
            border: 2px solid var(--primary-blue);
            color: var(--primary-blue);
            font-family: var(--font-heading);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .link-btn:hover {
            background: var(--primary-blue);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(62, 113, 136, 0.2);
        }

        .link-btn i {
            font-size: 1.25rem;
            position: absolute;
            left: 20px;
        }

        .link-btn.btn-featured {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-blue-dark));
            color: white;
            border: none;
        }

        .link-btn.btn-featured:hover {
            box-shadow: 0 10px 25px rgba(62, 113, 136, 0.4);
        }

        .link-btn.disabled {
            opacity: 0.6;
            cursor: not-allowed;
            border-color: #cbd5e1;
            color: #64748b;
        }

        .link-btn.disabled:hover {
            transform: none;
            box-shadow: none;
            background: white;
        }
        
        .footer-hub {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="links-container">
        <img src="https://i.ibb.co/fGSXRLW4/Giselr-Besf-nw.webp" alt="Gisele Ribeiro" class="hub-logo">
        
        <div class="hub-intro">
            <h1>Canais de Acesso</h1>
            <p>Escolha como deseja falar com a gente ou saber mais sobre nossos tratamentos.</p>
        </div>

        <div class="links-list">
            <!-- WhatsApp -->
            <a href="https://wa.me/5562996547768?text=Olá! Vi o link no seu perfil e gostaria de mais informações sobre os tratamentos da Gisele Ribeiro." 
               target="_blank" 
               class="link-btn btn-featured">
                <i class="fa-brands fa-whatsapp"></i> Atendimento no WhatsApp
            </a>

            <!-- Website -->
            <a href="https://giseleribeiroesteticaesaude.github.io/home/" 
               target="_blank" 
               class="link-btn">
                <i class="fa-solid fa-globe"></i> Nosso Site Oficial
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/gisele.ribeirodeoliveira.9" 
               target="_blank" 
               class="link-btn">
                <i class="fa-brands fa-facebook"></i> Facebook
            </a>

            <!-- Location -->
            <a href="https://maps.app.goo.gl/PEFEUoAW31WQsVHy6" 
               target="_blank" 
               class="link-btn">
                <i class="fa-solid fa-location-dot"></i> Como Chegar (Mapa)
            </a>

            <!-- Courses -->
            <a href="cursos.html" class="link-btn">
                <i class="fa-solid fa-graduation-cap"></i> Gisele Ribeiro Academy (Cursos)
            </a>
        </div>

        <div class="footer-hub">
            &copy; 2026 Gisele Ribeiro Saúde e Estética
        </div>
    </div>

</body>
</html>
