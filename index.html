<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gisele Ribeiro Saúde e Estética - Site em Manutenção. Voltamos em breve com novidades incríveis. Entre em contato pelo WhatsApp para agendamentos.">
    <title>Voltamos em Breve | Gisele Ribeiro Saúde e Estética</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="https://i.ibb.co/fGSXRLW4/Giselr-Besf-nw.webp">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #3E7188;
            --primary-blue-dark: #1F3642;
            --primary-blue-light: #5A8FAD;
            --bg-dark: #122027;
            --text-light: #E8EDEF;
            --text-muted: #9CA7AE;
            --accent: #E8EDEF;
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background mesh */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(62, 113, 136, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 70% 70%, rgba(90, 143, 173, 0.12) 0%, transparent 40%);
            animation: rotateBg 40s linear infinite;
            z-index: 1;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .maintenance-container {
            width: 90%;
            max-width: 550px;
            background: rgba(31, 54, 66, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 3.5rem 2.5rem;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 10;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-img {
            height: 90px;
            width: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
            animation: pulseLogo 3s ease-in-out infinite;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(62, 113, 136, 0.2);
            border: 1px solid rgba(90, 143, 173, 0.3);
            color: var(--primary-blue-light);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .badge i {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.2;
            color: #ffffff;
            margin-bottom: 1rem;
        }

        .highlight {
            color: var(--primary-blue-light);
            background: linear-gradient(135deg, #a5d3eb, var(--primary-blue-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            background: #25D366;
            color: #ffffff;
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 600;
            padding: 1.1rem 2.2rem;
            border-radius: 50px;
            text-decoration: none;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            background: #20ba5a;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.4);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .social-icon {
            color: var(--text-muted);
            font-size: 1.3rem;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            color: #ffffff;
            transform: translateY(-3px);
        }

        @media (max-width: 480px) {
            .maintenance-container {
                padding: 2.5rem 1.5rem;
            }
            h1 {
                font-size: 1.8rem;
            }
            p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <!-- Logo -->
        <img src="https://i.ibb.co/fGSXRLW4/Giselr-Besf-nw.webp" alt="Gisele Ribeiro" class="logo-img">
        
        <!-- Status Badge -->
        <div class="badge">
            <i class="fa-solid fa-circle-notch"></i> Em Atualização
        </div>
        
        <!-- Heading -->
        <h1>Preparando <span class="highlight">Novidades</span></h1>
        
        <!-- Text -->
        <p>Estamos realizando melhorias em nosso site para oferecer a você uma experiência digital ainda mais completa e agradável. Nossos atendimentos e agendamentos continuam normalmente.</p>
        
        <!-- CTA Button -->
        <a href="https://wa.me/5562996547768?text=Olá! Gostaria de mais informações sobre os tratamentos e agendamentos da Gisele Ribeiro." 
           target="_blank" 
           class="btn-whatsapp">
            <i class="fa-brands fa-whatsapp"></i> Agendar pelo WhatsApp
        </a>
        
        <!-- Social Media Links -->
        <div class="social-links">
            <a href="https://www.instagram.com/giseleribeiro.esteticacomsaude/" target="_blank" class="social-icon" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://www.facebook.com/gisele.ribeirodeoliveira.9/" target="_blank" class="social-icon" aria-label="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="links.html" class="social-icon" aria-label="Canais de Acesso">
                <i class="fa-solid fa-link"></i>
            </a>
        </div>
    </div>

</body>
</html>
