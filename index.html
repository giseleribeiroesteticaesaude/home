<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gisele Ribeiro Saúde e Estética - Site em Manutenção. Voltamos em breve.">
    <title>Manutenção | Gisele Ribeiro Saúde e Estética</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="https://i.ibb.co/fGSXRLW4/Giselr-Besf-nw.webp">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #3E7188;
            --primary-blue-dark: #1F3642;
            --primary-blue-light: #5A8FAD;
            --bg-dark: #122027;
            --text-light: #E8EDEF;
            --text-muted: #9CA7AE;
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background mesh */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(62, 113, 136, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 70% 70%, rgba(90, 143, 173, 0.08) 0%, transparent 40%);
            animation: rotateBg 40s linear infinite;
            z-index: 1;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .maintenance-container {
            width: 90%;
            max-width: 500px;
            background: rgba(31, 54, 66, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 4rem 3rem;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 10;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-img {
            height: 90px;
            width: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(62, 113, 136, 0.15);
            border: 1px solid rgba(90, 143, 173, 0.2);
            color: var(--primary-blue-light);
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .badge i {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.2;
            color: #ffffff;
            margin-bottom: 1.2rem;
        }

        .highlight {
            color: var(--primary-blue-light);
            background: linear-gradient(135deg, #a5d3eb, var(--primary-blue-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 0;
        }

        @media (max-width: 480px) {
            .maintenance-container {
                padding: 3rem 1.5rem;
            }
            h1 {
                font-size: 1.8rem;
            }
            p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <!-- Logo -->
        <img src="https://i.ibb.co/fGSXRLW4/Giselr-Besf-nw.webp" alt="Gisele Ribeiro" class="logo-img">
        
        <!-- Status Badge -->
        <div class="badge">
            <i class="fa-solid fa-circle-notch"></i> Em Manutenção
        </div>
        
        <!-- Heading -->
        <h1>Voltamos em <span class="highlight">Breve</span></h1>
        
        <!-- Text -->
        <p>Estamos realizando atualizações no momento para oferecer uma experiência melhor. Agradecemos a sua compreensão.</p>
    </div>

</body>
</html>
